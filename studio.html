<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Writing Studio | Haitish</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="journal.css"><script src="scripts/journal.js" defer></script><script src="scripts/studio.js" defer></script></head><body><header><a class="brand" href="index.html">HAITISH / STUDIO</a><a href="everyday.html">View journal</a></header><main class="studio"><p class="micro">YOUR WRITING SPACE</p><h1>One thought at a time.</h1><p>Drafts are stored in this browser, on this device. Export a backup to keep them. Publishing is not connected yet.</p><div class="studio-tools"><label>Draft <select id="draft-list" aria-label="Choose a draft"></select></label><button id="new-draft" type="button">New note</button><button id="export-draft" type="button">Export draft</button><label>Import draft <input type="file" id="import-draft" accept="application/json,.json"></label></div><div class="studio-grid"><form id="editor"><label>Title<input id="title" maxlength="160" required placeholder="What's on your mind?"></label><label>Date<input id="date" type="date" required></label><label>Short introduction<textarea id="excerpt" rows="3" maxlength="400"></textarea></label><label>Your story<textarea id="body" rows="17" placeholder="Start writing..."></textarea></label><p class="small">Use a blank line between paragraphs, ## for a heading, and &gt; for a quote.</p><button type="submit">Save draft</button><p id="draft-status" role="status" class="small"></p></form><section class="studio-preview" aria-label="Live preview"><p class="micro">PREVIEW</p><h2 id="preview-title">Untitled note</h2><p id="preview-excerpt"></p><div id="preview-body" class="story-body"></div></section></div></main></body></html>
